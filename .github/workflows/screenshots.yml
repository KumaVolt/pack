# Retakes the README screenshots (docs/screenshots) with scripts/screenshots.sh
# whenever the app or daemon changes, and commits them if they look different. On pull
# requests it only uploads them, so UI changes can be looked at before merging.
name: Screenshots

on:
  push:
    branches: [main]
    paths: &ui ["daemon/**", "app/**", "scripts/screenshots.sh", ".github/workflows/screenshots.yml"]
  pull_request:
    paths: *ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # macOS: every service runs there, and the app looks the way most people see it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          cargo build --release -p pack
          cargo build --release -p pack-app --features screenshots
      # The app renders each page offscreen, so no screen recording permission is needed.
      - name: Take screenshots
        run: scripts/screenshots.sh target/release/pack target/release/pack-app docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README screenshots"
          git push
