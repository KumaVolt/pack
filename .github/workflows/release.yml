# Releases Pack itself when a v* tag is pushed: the desktop app for every OS
# (with the `pack` CLI/daemon inside) and the bare `pack` binary that
# `pack self-update` downloads.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         triple: aarch64-apple-darwin,      target: macos-arm64,    formats: "app,dmg" }
          - { runner: macos-15-intel,   triple: x86_64-apple-darwin,       target: macos-x86_64,   formats: "app,dmg" }
          - { runner: ubuntu-22.04,     triple: x86_64-unknown-linux-gnu,  target: linux-x86_64,   formats: "deb,appimage" }
          - { runner: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu, target: linux-arm64,    formats: "deb,appimage" }
          - { runner: windows-latest,   triple: x86_64-pc-windows-msvc,    target: windows-x86_64, formats: "nsis,wix" }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo scripts/linux-deps.sh
      - name: Build app
        run: scripts/build-app.sh --target "${{ matrix.triple }}" --formats "${{ matrix.formats }}"
      - name: Collect
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-dev"
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          rel="target/${{ matrix.triple }}/release"
          mkdir -p out
          asset="pack-$version-${{ matrix.target }}.tar.gz"
          tar -C "$rel" -czf "out/$asset" "pack$ext"
          (cd out && (sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset") > "$asset.sha256")
          p="target/${{ matrix.triple }}/packager"
          case "${{ runner.os }}" in
            macOS)   cp "$p"/*.dmg out/ ;;
            Linux)   cp "$p"/*.deb "$p"/*.AppImage out/ ;;
            Windows) cp "$p"/*.exe "$p"/*.msi out/ ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.target }}
          path: out/*
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Pack $GITHUB_REF_NAME" --generate-notes || sleep 5
          for i in 1 2 3; do gh release upload "$GITHUB_REF_NAME" out/* --clobber && break; sleep 10; done
