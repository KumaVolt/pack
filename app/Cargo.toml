[package]
name = "pack-app"
description = "Pack desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pack-app"
path = "src/main.rs"

[features]
# `pack-app --screenshots`: renders each page offscreen to PNGs (README
# screenshots). Needs GPUI's test support, so it stays out of release builds.
screenshots = ["gpui-kit/test-support", "dep:taffy", "dep:unicode-properties"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
gpui-kit = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tray-icon = "0.26"
png = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# GPUI's test support also resolves GPUI Fast, which pins these exactly; pin
# them here too so one lockfile serves both builds.
taffy = { version = "=0.15.0", optional = true }
unicode-properties = { version = "=0.1.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Installers, built by scripts/build-app.sh with cargo-packager.
[package.metadata.packager]
product-name = "Pack"
identifier = "dev.pack.app"
category = "DeveloperTool"
description = "Local PHP development environment"
long-description = "Sites with HTTPS, PHP versions, MySQL, PostgreSQL, Redis, mail and more — free and open source."
homepage = "https://github.com/KumaVolt/pack"
publisher = "KumaVolt"
license-file = "../LICENSE"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
# The `pack` CLI/daemon, copied from binaries/pack-<target-triple>.
external-binaries = ["binaries/pack"]

[[package.metadata.packager.binaries]]
path = "pack-app"
main = true

[package.metadata.packager.macos]
minimum-system-version = "13.0"
signing-identity = "-"

[package.metadata.packager.deb]
depends = ["libayatana-appindicator3-1", "libgtk-3-0", "libxkbcommon-x11-0", "libvulkan1", "libwayland-client0", "libxcb1", "libfontconfig1"]
